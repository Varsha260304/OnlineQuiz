<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="style1.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            console.log('jQuery is loaded and ready');
        });

        function validateForm() {
            var fullName = document.getElementById("full_name").value;
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;
            var gender = document.querySelector('input[name="gender"]:checked');
            var email = document.getElementById("email").value;
            var phone = document.getElementById("phone").value;
            var confirmPassword = document.getElementById("confirm_password").value;
            var usernameRegex = /^[a-zA-Z0-9]+$/;
            var passwordRegex = /^(?=.*[A-Z])(?=.*[!@#$%^&*])(?=.*[0-9])[a-zA-Z0-9!@#$%^&*]{8,}$/;
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (fullName.trim() === "") {
                alert("Please enter your full name");
                document.getElementById("full_name").focus();
                return false;
            } else if (username.trim() === "") {
                alert("Please enter a username");
                document.getElementById("username").focus();
                return false;
            } else if (!usernameRegex.test(username)) {
                alert("Username should contain only alphanumeric characters");
                document.getElementById("username").focus();
                return false;
            } else if (password.trim() === "") {
                alert("Please enter a password");
                document.getElementById("password").focus();
                return false;
            } else if (!passwordRegex.test(password)) {
                alert("Password should be at least 8 characters long with at least one uppercase letter, one special character, and one digit.");
                document.getElementById("password").focus();
                return false;
            } else if (confirmPassword.trim() === "") {
                alert("Please confirm your password");
                document.getElementById("confirm_password").focus();
                return false;
            } else if (confirmPassword !== password) {
                alert("Passwords do not match");
                document.getElementById("confirm_password").focus();
                return false;
            } else if (email.trim() === "") {
                alert("Please enter your email address");
                document.getElementById("email").focus();
                return false;
            } else if (!emailRegex.test(email)) {
                alert("Please enter a valid email address");
                document.getElementById("email").focus();
                return false;
            } else if (gender === null) {
                alert("Please select your gender");
                return false;
            } else {
                var data = {
                    name: username,
                    password: password,
                    phone: phone,
                    mail: email,
                    gender: gender.value
                };
                $.ajax({
                    type: 'POST',
                    url: 'http://localhost:8080/users/addUser',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function(response) {
                        console.log('AJAX Success:', response);
                        alert('User added successfully');
                    },
                    error: function(xhr, status, error) {
                        console.error('AJAX Error:', error);
                        console.log('Status:', status);
                        console.log('XHR:', xhr);
                    }
                });
                return false; // Prevent default form submission
            }
        }
    </script>
</head>
<body>
    <div class="wrapper">
        <form action="#" onsubmit="return validateForm()">
            <h1>Registration</h1>
            <div class="input-box">
                <input type="text" placeholder="Full Name" id="full_name">
                <i class='bx bx-user'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Username" id="username">
                <i class='bx bx-user'></i>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" id="password">
                <i class='bx bx-lock-alt'></i>
            </div>
            <div class="input-box" >
                <input type="password" placeholder="Confirm Password" id="confirm_password">
                <i class='bx bx-lock-alt'></i>
            </div>
            <div class="input-box" >
                <input type="text" placeholder="Phone" id="phone">
                <i class='bx bx-lock-alt'></i>
            </div>
            <div class="input-box">
                <input type="email" placeholder="Email" id="email">
                <i class='bx bx-envelope'></i>
            </div>
            <div class="">
                <label for="male" style="color: white; margin-left: 70px; ">Male</label>
                <input type="radio" name="gender" id="male" value="male">
                <label for="female" style="color: white; margin-left: 10px;">Female</label>
                <input type="radio" name="gender" id="female" value="female">
                <label for="others" style="color: white; margin-left: 10px;">Others</label>
                <input type="radio" name="gender" id="others" value="others">
            </div>
            <button type="submit" class="btn" style="margin-bottom: 20px;">Register</button>
            <div class="register-link" >
                <p>Already have an account? <a href="index.html">Login</a></p>
            </div>
        </form>
    </div>
</body>
</html>
