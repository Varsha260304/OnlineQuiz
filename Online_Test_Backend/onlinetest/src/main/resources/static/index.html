<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function goSubmit() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;
            var usernameRegex = /^[a-zA-Z0-9]+$/;
            var passwordRegex = /^(?=.*[A-Z])(?=.*[!@#$%^&*])(?=.*[0-9])[a-zA-Z0-9!@#$%^&*]{8,}$/;

            if (username.trim() === "") {
                alert("Please enter a username");
                document.getElementById("username").focus();
                return false;
            } else if (!usernameRegex.test(username)) {
                alert("Username should contain only alphanumeric characters");
                document.getElementById("username").focus();
                return false;
            }

            if (password.trim() === "") {
                alert("Please enter a password");
                document.getElementById("password").focus();
                return false;
            } else if (!passwordRegex.test(password)) {
                alert("Password should be at least 8 characters long with at least one uppercase letter, one special character, and one digit.");
                document.getElementById("password").focus();
                return false;
            } else {
                $.ajax({
                    type: 'POST',
                    url: '/login',
                    data: {
                        username: username,
                        password: password
                    },
                    success: function(response) {
                        alert(response.message);
                        if (response.redirect) {
                            window.location.href = response.redirect;
                        }
                    },
                    error: function(response) {
                        alert(response.responseJSON.error);
                    }
                });
            }
        }
    </script>
</head>
<body>
    <div class="wrapper">
        <form action="" method="post">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder="Username" id="username" name="username">
                <i class='bx bx-user'></i>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" id="password" name="password">
                <i class='bx bx-lock-alt'></i>
            </div>
            <button type="button" class="btn" onclick="goSubmit()" style="margin-bottom: 10px;">Login</button>
            <div class="register-link">
                <p>Don't have an account? <a href="/newUserCreation">Register</a></p>
            </div>
        </form>
    </div>
</body>
</html>
